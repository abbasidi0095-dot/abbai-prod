</div>

<form class="flex flex-col gap-stack-md" id="signup-form">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-stack-sm uppercase tracking-wider" for="name">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-[#1A2235]/50 border border-white/10 rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-white placeholder-outline-variant focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all outline-none" id="name" name="name" placeholder="Jane Doe" required="" type="text"/>
</div>
<div class="validation-message text-error text-xs font-label-sm mt-1">Please enter your full name.</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-stack-sm uppercase tracking-wider" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-[#1A2235]/50 border border-white/10 rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-white placeholder-outline-variant focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all outline-none" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<div class="validation-message text-error text-xs font-label-sm mt-1">Please enter a valid email address.</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-stack-sm uppercase tracking-wider" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-[#1A2235]/50 border border-white/10 rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md text-white placeholder-outline-variant focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors toggle-password" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
<div class="mt-2 h-1.5 w-full bg-surface-container-high rounded-full overflow-hidden">

</div>

<span class="text-[10px] text-on-surface-variant uppercase tracking-widest">Strength</span>

</div>

</div>

<div class="flex items-center h-5">

</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">I agree to the <a class="text-primary hover:text-primary-fixed transition-colors underline decoration-primary/30 underline-offset-2" href="#">Terms of Service</a> and <a class="text-primary hover:text-primary-fixed transition-colors underline decoration-primary/30 underline-offset-2" href="#">Privacy Policy</a></label>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('signup-form');
    var errorEl = document.getElementById('signup-error');
    var btn = document.getElementById('signup-btn');
    var password = document.getElementById('password');
    var confirm = document.getElementById('confirm-password');
    var strengthBar = document.getElementById('strength-bar');
    var strengthText = document.getElementById('strength-text');

    document.querySelectorAll('input').forEach(function (input) {
        input.addEventListener('invalid', function (e) { e.preventDefault(); var msg = input.parentElement.parentElement.querySelector('.validation-message'); if(msg) msg.classList.add('show'); });
        input.addEventListener('input', function () { var msg = input.parentElement.parentElement.querySelector('.validation-message'); if(msg) msg.classList.remove('show'); });
    });

    document.querySelector('.toggle-password').addEventListener('click', function () {
        var type = password.type === 'password' ? 'text' : 'password';
        password.type = type;
        confirm.type = type;
    });

    password.addEventListener('input', function () {
        var val = password.value;
        var score = 0;
        if (val.length > 7) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        var widths = ['w-1/4', 'w-2/4', 'w-3/4', 'w-full'];
        var labels = ['Weak', 'Fair', 'Good', 'Strong'];
        strengthBar.className = 'h-full bg-gradient-primary rounded-full transition-all duration-300 ease-out ' + (widths[Math.max(0, score-1)] || 'w-1/4');
        strengthText.textContent = labels[Math.max(0, score-1)] || 'Weak';
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.classList.add('hidden');
        if (password.value !== confirm.value) {
            errorEl.textContent = 'Passwords do not match';
            errorEl.classList.remove('hidden');
            return;
        }
        btn.textContent = 'Creating account...';
        var name = document.getElementById('name').value;
        var email = document.getElementById('email').value;
        signup(email, password.value, name).then(function () {
            window.location.href = '/chat.html';
        }).catch(function (err) {
            btn.textContent = 'Create Account';
            errorEl.textContent = (err.data && err.data.message) || err.message || 'Signup failed';
            errorEl.classList.remove('hidden');
        });
    });
});
</script>
