<script>
document.addEventListener("DOMContentLoaded", function () {
    var container = document.getElementById('particles-container');
    if(container) {
        for(var i=0; i<25; i++) {
            var p = document.createElement('div');
            p.classList.add('particle');
            var size = Math.random() * 3 + 1;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = (Math.random() * 100) + '%';
            p.style.top = (Math.random() * 100) + '%';
            p.style.animationDelay = (Math.random() * 4) + 's';
            p.style.animationDuration = (Math.random() * 4 + 3) + 's';
            container.appendChild(p);
        }
    }

    var canvas = document.getElementById("glcanvas");
    if (canvas) {
        try {
            var gl = canvas.getContext("webgl");
            if (gl) {
                function syncSize() {
                    canvas.width = canvas.clientWidth;
                    canvas.height = canvas.clientHeight;
                }
                syncSize();
                window.addEventListener('resize', syncSize);

                var vsSource = 'attribute vec4 aVertexPosition; varying vec2 v_texCoord; void main() { gl_Position = aVertexPosition; v_texCoord = aVertexPosition.xy * 0.5 + 0.5; }';
                var fsSource = 'precision highp float; varying vec2 v_texCoord; uniform float u_time; void main() { vec2 uv = v_texCoord; float n = sin(uv.x*2.0+u_time*0.2)*0.5+0.5; n += cos(uv.y*2.0+u_time*0.3)*0.5+0.5; vec3 a = vec3(0.039,0.047,0.078); vec3 b = vec3(0.067,0.094,0.153); vec3 c = mix(a,b,n*0.5); float g = (step(0.98,fract(uv.x*10.0))+step(0.98,fract(uv.y*10.0)))*0.02; c += g; gl_FragColor = vec4(c,1.0); }';

                function cs(t,s){var sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;}
                var prog = gl.createProgram();
                gl.attachShader(prog, cs(gl.VERTEX_SHADER, vsSource));
                gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fsSource));
                gl.linkProgram(prog); gl.useProgram(prog);
                if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('shader link failed');
                var buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,1,1,1,-1,-1,1,-1]), gl.STATIC_DRAW);
                var pos = gl.getAttribLocation(prog, "aVertexPosition");
                if (pos < 0) throw new Error('attrib not found');
                gl.enableVertexAttribArray(pos);
                gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
                var tLoc = gl.getUniformLocation(prog, "u_time");
                var start = Date.now();
                function render(){ gl.uniform1f(tLoc, (Date.now()-start)*0.001); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); requestAnimationFrame(render); }
                render();
            }
        } catch (e) {
            console.warn('WebGL background skipped', e);
        }
    }

    var form = document.getElementById('login-form');
    var errorEl = document.getElementById('login-error');
    var loginText = document.getElementById('login-text');

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.classList.add('hidden');
        loginText.textContent = 'Signing in...';
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        var remember = document.getElementById('remember').checked;
        login(email, password, remember).then(function () {
            window.location.href = '/chat.html';
        }).catch(function (err) {
            loginText.textContent = 'Sign In';
            errorEl.textContent = (err.data && err.data.message) || err.message || 'Login failed';
            errorEl.classList.remove('hidden');
        });
    });

    document.querySelectorAll('.oauth-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            window.location.href = '/api/auth/oauth/' + btn.dataset.provider;
        });
    });
});
</script>
