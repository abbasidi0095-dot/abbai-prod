(function(){

  if(typeof ResizeObserver!=='undefined') new ResizeObserver(syncSize).observe(canvas);

    var fs='precision highp float; varying vec2 v_texCoord; uniform float u_time; void main(){ vec2 uv=v_texCoord; float n=sin(uv.x*2.0+u_time*0.2)*0.5+0.5; n+=cos(uv.y*2.0+u_time*0.3)*0.5+0.5; vec3 a=vec3(0.039,0.047,0.078); vec3 b=vec3(0.067,0.094,0.153); vec3 c=mix(a,b,n*0.5); float g=(step(0.98,fract(uv.x*10.0))+step(0.98,fract(uv.y*10.0)))*0.02; c+=g; gl_FragColor=vec4(c,1.0); }';
    function cs(t,s){var sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;}
    var prog=gl.createProgram(); gl.attachShader(prog,cs(gl.VERTEX_SHADER,vs)); gl.attachShader(prog,cs(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(prog); gl.useProgram(prog);
    var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    var pos=gl.getAttribLocation(prog,'a_position'); gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);
    var tLoc=gl.getUniformLocation(prog,'u_time');
    function render(t){ if(typeof ResizeObserver==='undefined') syncSize(); gl.viewport(0,0,canvas.width,canvas.height); gl.uniform1f(tLoc,t*0.001); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); requestAnimationFrame(render); }
    render(0);
  }
